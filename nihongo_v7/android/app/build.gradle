plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {

    namespace "com.example.nihongolens"

    compileSdkVersion 34

    ndkVersion "26.1.10909125"

    defaultConfig {

        applicationId "com.example.nihongolens"

        minSdkVersion 29

        targetSdkVersion 34

        versionCode 1

        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {

        release {

            signingConfig signingConfigs.debug

            minifyEnabled false
        }
    }

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {

        jvmTarget = "17"
    }

    externalNativeBuild {

        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

flutter {
    source "../.."
}
